<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
    <link rel="stylesheet" href="/CSS/login.css">
    <link rel="icon" href="/img/logo-wellcampus-icono.svg">
</head>
<body>

    <main>
        <header>
            <img src="/img/logo-wellcampus.svg" id="logo" alt="logo wellCampus">
            <h1>WellCampus</h1>

            <h2>Bienvenido a WellCampus</h2>
            <p>Inicia sesión para continuar con tu progreso</p>
        </header>

        <form id="form-login">
            <label for="user">Usuario</label>
            <input type="text" id="user" name="user" class="input-field" placeholder="Ingresa tu usuario" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="input-field" placeholder="Ingresa tu contraseña" required>

            <div class="checkbox-group">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Mantener sesión iniciada</label>
            </div>

            <button type="submit" class="home">Iniciar sesión</button>
        </form>

        <p id="error-message" class="hidden">Credenciales incorrectas</p>

        <a href="/HTML/recoverpassword.html" class="link-auth">¿Olvidaste tu contraseña?</a>
        <a href="/HTML/record.html" class="link-auth">¿No tienes cuenta? Crear cuenta</a>
    </main>

    <footer>
        <p>© 2025 WellCampus. Todos los derechos reservados.</p>
    </footer>

    <script src="/JS/storage.js"></script>
    <script src="/JS/login.js"></script>
</body>
</html>
