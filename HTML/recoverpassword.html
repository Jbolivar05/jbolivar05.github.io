<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="/CSS/recover-password.css">
</head>
<body>

    <main>
        <header>
            <img src="/img/logo-wellcampus.svg" id="logo" alt="logo wellCampus">
            <h1>WellCampus</h1>
        </header>

        <h2>Olvidé mi contraseña</h2>
        <p>No te preocupes, te ayudaremos a recuperarla</p>

        <img src="/img/icon-recover-email.svg" alt="Icono de correo con candado" class="recover-illustration">

        <h3>Ingresa tu correo electrónico</h3>
        <p>Te enviaremos un enlace para restablecer tu contraseña.</p>

        <form id="form-recover">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="Ingresa tu correo electrónico" required>

            <button type="submit">Enviar enlace de recuperación</button>
        </form>

        <p id="email-sent" class="hidden">Correo enviado</p>

        <a href="/HTML/login.html" class="link-auth">Volver al inicio de sesión</a>
    </main>

    <footer>
        <p>© 2025 WellCampus. Todos los derechos reservados.</p>
    </footer>

    <script src="/JS/storage.js"></script>
    <script src="/JS/recoverpassword.js"></script>
</body>
</html>
