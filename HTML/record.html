<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="/CSS/record.css">
</head>
<body>
    <header>
        <img src="/img/logo-wellcampus.svg" alt="logo-wellcampus">
        <h1>WellCampus</h1>
    </header>

    <main>
        <h2>Registrar cliente</h2>
        <p>Crea tu cuenta para comenzar</p>

        <form id="form-record">
            <fieldset>
                <legend>Datos personales</legend>

                <label for="name">Nombre completo</label>
                <input type="text" id="name" name="name" autocomplete="name" class="input-field" placeholder="Ingresa tu nombre completo" required>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" autocomplete="email" class="input-field" placeholder="Ingresa tu correo electrónico" required>

                <label for="identification">Número de identificación</label>
                <input type="text" id="identification" name="identification" class="input-field" placeholder="Ingresa tu número de identificación" required>

                <label for="birthdate">Fecha de nacimiento</label>
                <input type="date" id="birthdate" name="birthdate" class="input-field" placeholder="dd/mm/aaaa" required>
            </fieldset>

            <fieldset>
                <div class="form-row">
                    <div class="form-group">
                        <label for="gender">Género</label>
                        <select id="gender" name="gender" required>
                            <option value="" disabled selected>Selecciona</option>
                            <option value="femenino">Femenino</option>
                            <option value="masculino">Masculino</option>
                            <option value="otro">Otro</option>
                            <option value="prefiero-no-decir">Prefiero no decir</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="phone">Teléfono</label>
                        <input type="tel" id="phone" name="phone" autocomplete="tel" class="input-field" placeholder="Ingresa tu teléfono" required>
                    </div>
                </div>
            </fieldset>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="new-password" class="input-field" placeholder="Crea una contraseña" required>

            <label for="confirm-password">Confirmar contraseña</label>
            <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" class="input-field" placeholder="Confirma tu contraseña" required>

            <div class="checkbox-group">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">Acepto los <a href="/terms/terms.html">Términos y condiciones</a> y la <a href="/privacy/privacy.html">Política de privacidad</a></label>
            </div>

            <button type="submit">Crear cuenta</button>
        </form>

        <a href="/HTML/login.html" class="link-auth">¿Ya tienes cuenta? Inicia sesión</a>
    </main>

    <footer>
        <p>© 2025 WellCampus. Todos los derechos reservados.</p>
    </footer>

    <script src="/JS/storage.js"></script>
    <script src="/JS/record.js"></script>
</body>
</html>
